function openMonthShifts(){const [a]=bounds(month+'-01'),[b]=bounds(addMonths(month,1)+'-01'),shifts=state.events.filter(e=>e.kind==='work'&&Date.parse(e.start)<b&&Date.parse(e.end)>a).sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));editing={type:'month-shifts'};openModal('Смены · '+monthLabel(month),`<div class="small muted" style="margin-bottom:16px">Внесено ${shifts.length} смен · ${cash(salary(shifts,a,b))} по графику</div>${shifts.map(e=>`<button class="slot-option" data-act="event" data-id="${esc(e.id)}" style="margin-bottom:8px"><span><strong>${dayLabel(dateKey(e.start))}</strong><br>${clock(e.start)}–${clock(e.end)}${dateKey(e.end)!==dateKey(e.start)?' · до следующего дня':''}</span><span>${dur(paidMinutes(e))}</span></button>`).join('')||'<p class="muted">Смен пока нет</p>'}<div class="dialog-actions"><button class="btn primary" data-act="new-shift">Добавить смену</button><button class="btn" data-act="close">Закрыть</button></div>`)}

function help(){editing={type:'help'};openModal('Твой календарь и данные',`<div class="help-copy"><p><b>Календарь открывается по ссылке и доступен файлом.</b> На сайте события, задачи, сон, баллы и деньги сохраняются в общем JSON-документе. Открывай свою персональную ссылку на другом устройстве — вход не требуется. Обновления приходят обычно за 1–2 секунды, когда приложение открыто. Скачанный файл работает отдельно, без синхронизации.</p><p><b>На шкале — точные интервалы событий.</b> Линия показывает текущее время Польши. Пересекающиеся события находятся на отдельных дорожках. Окна для дел учитывают события и план сна.</p><p><b>Зарплата по графику — расчёт.</b> Часы смен минус неоплаченные перерывы умножаются на ставку события. «Начислено» растёт по прошедшему времени; перерывы распределены пропорционально. Налоги, доплаты и фактический выход на работу автоматически не учитываются.</p><p><b>Остаток — фактические деньги.</b> Запиши получение зарплаты как доход. Перевод в накопления уменьшает доступный остаток и увеличивает отложенное, без двойного учёта. Начальные суммы относятся к началу указанной даты; операции до неё не прибавляются повторно.</p><p><b>Сон и чекапы.</b> Начальный редактируемый шаблон — 01:00–09:00. Бледные блоки обозначают план; отметки «Ложусь» и «Проснулся» сохраняют фактическое время в постели. Утреннее главное дело добавляется в задачи. Чекапы заполняются здесь, когда открываешь календарь.</p><p><b>Отдельная ночь.</b> Нажатие на сон в календаре меняет только эту ночь. Обычный режим доступен в разделе «Сон» и не перезаписывает отдельно настроенные ночи.</p><p><b>Дела с галочками.</b> В меню «Добавить» выбери дело или привычку. Повторение можно настроить на каждый день, будни или свои дни недели, без даты окончания. Выполнение отмечается отдельно по дням. Дата последнего повтора события задаётся отдельно от его часов.</p><p><b>Баллы и награды.</b> Вечер и утро дают по 10 баллов один раз в день, задача — 15 один раз за задачу, сверка денег — 5 в день. Повторное редактирование не начисляет баллы. Награды можно менять, создавать и забирать за накопленные баллы. Это не реальные расходы.</p><p><b>Сентябрь 2026.</b> Встроены 15 ранее полученных смен. При первом обновлении смена на уже занятую работой дату повторно не добавляется. Дальше график редактируешь сам.</p><p><b>Резервная копия важна.</b> Очистка данных браузера, смена браузера или адреса файла может скрыть записи. Чтобы перенести записи из скачанного файла на сайт, нажми в файле «Сохранить копию», затем на сайте «Восстановить». На сайте кнопка «Сохранить» подтверждает запись в календаре. Без связи черновик ждёт повтора синхронизации; локальная копия сохраняется, если браузер разрешает хранение. Во время редактирования форма не обновляется извне. Для загрузки последних записей после закрытия формы подожди пару секунд.</p></div><div class="dialog-actions"><button class="btn primary" data-act="close">Понятно</button></div>`)}

function sleepQuick(){const info=sleepSummary(state),p=state.settings.sleepPlan,active=info.active,stats=rewardSummary(state);return `<section class="sleep-quick"><div class="sleep-quick-text"><span class="sleep-icon" aria-hidden="true">☾</span><div><strong>${active?'Идёт запись сна':'Вечер → сон → утро'}</strong><div class="small muted">${active?'Отметка с '+clock(active.start)+' · '+dur((Date.now()-Date.parse(active.start))/60000)+' в постели':p.enabled?'План '+p.bed+'–'+p.rise+' · можно изменить':'План сна выключен'}</div></div></div><div class="row"><button class="btn ${active?'':'primary'}" data-act="bed-check" ${active?'disabled':''}>Ложусь · +10</button><button class="btn ${active?'primary':''}" data-act="wake-check">Проснулся · +10</button><button class="btn quiet small-btn" data-act="tab" data-value="rewards">${stats.available} баллов</button></div></section>`}

function openSleepSettings(){const p=state.settings.sleepPlan;editing={type:'sleep-settings'};openModal('Обычный режим сна',`<form id="sleep-settings-form"><div class="scope-note"><strong>Обычный режим для остальных дней</strong><br>Отдельно изменённые ночи сохранят свои часы.</div><div class="fields"><label class="field-check"><input name="enabled" type="checkbox" ${p.enabled?'checked':''}>Показывать сон в календаре</label>${field('Планирую лечь','bed',p.bed,'time','required')}${field('Планирую встать','rise',p.rise,'time','required')}<label class="field-check"><input name="adjust" type="checkbox" ${p.adjust?'checked':''}>Учитывать занятые события</label>${field('Дорога и сборы вокруг смен, мин','buffer',p.buffer,'number','min="0" max="240" step="5" required')}</div><div class="form-note">Стартовый шаблон — 01:00–09:00. Это план, а не уже состоявшийся сон. Если смена или дело пересекаются с ним, остаётся самое длинное свободное окно внутри выбранного времени. Если свободного окна нет, сон остаётся на шкале с предупреждением о пересечении.</div>${actions('sleep-settings',null)}</form>`)}
function openCheckin(mode,id=null){let log=id?state.sleepLogs.find(l=>l.id===id):state.sleepLogs.find(l=>!l.end);if(mode==='bed'&&log&&!log.end){notify('Запись уже идёт.');return}if(mode==='wake'&&!log){openCheckin('manual');return}if(mode==='manual')log=null;const now=Date.now(),plan=plannedSleep(state,dateKey(now)),start=log?.start||(mode==='bed'?new Date(now).toISOString():plan&&Date.parse(plan.start)<now?plan.start:instant(addDays(dateKey(now),-1)+'T23:00')),bedtime=['bed','bed-detail'].includes(mode),quick=['bed-detail','wake-detail'].includes(mode),morning=!bedtime;editing={type:mode,id:log?.id||null};const times=`${field('Лёг в постель','start',wall(start),'datetime-local','required')}${morning?field('Проснулся','end',wall(log?.end||now),'datetime-local','required'):''}`;openModal(bedtime?'Спокойной ночи':mode==='manual'?'Добавить сон':mode==='edit'?'Изменить сон':'Доброе утро',`<form id="sleep-log-form">${quick?`<div class="checkin-stamp">${icon(bedtime?'Moon':'Sun')}<div><strong>${bedtime?'Лёг в '+clock(start):'Проснулся в '+clock(log.end)}</strong><span>Время уже сохранено</span></div>${icon('Check')}</div>`:''}<div class="fields">${quick?`<details class="form-details field full"><summary>Изменить время</summary><div class="fields">${times}</div></details>`:times}${bedtime?`<label class="field-check"><input type="checkbox" name="planned" ${log?.bedtimeChecks.planned?'checked':''}>Посмотрел планы на завтра</label><label class="field-check"><input type="checkbox" name="screenOff" ${log?.bedtimeChecks.screenOff?'checked':''}>Готов отложить экран</label><label class="field full">Как прошёл день?<textarea name="eveningNote" maxlength="2000" placeholder="Пара слов, если хочется">${esc(log?.eveningNote||'')}</textarea></label>`:''}${morning?`<label class="field">Как спалось?<select name="quality">${options({'':'Без оценки','1':'1 · плохо','2':'2 · так себе','3':'3 · нормально','4':'4 · хорошо','5':'5 · отлично'},String(log?.quality||''))}</select></label><label c function updateEventNote(){const form=$('event-form');if(!form)return;const work=form.elements.kind.value==='work';$('work-fields').hidden=!work;for(const el of $('work-fields').querySelectorAll('input'))el.disabled=!work;form.querySelector('[data-event-end-date]').hidden=!form.elements.multiday.checked;form.elements.endDay.disabled=!form.elements.multiday.checked;form.querySelector('[data-event-check]').hidden=work;form.elements.checkable.disabled=work;if(form.elements.repeat){const f=new FormData(form),repeat=f.get('repeat'),custom=form.querySelector('[data-custom-days]');custom.hidden=repeat!=='custom';for(const el of custom.querySelectorAll('input'))el.disabled=repeat!=='custom';form.querySelector('[data-event-repeat-end]').hidden=repeat==='none';form.elements.until.disabled=repeat==='none'}try{const e=eventFromForm(),minutes=(Date.parse(e.end)-Date.parse(e.start))/60000;$('event-duration').textContent=dur(minutes)+(dateKey(e.end)!==dateKey(e.start)?' · окончание '+dayLabel(dateKey(e.end))+' в '+clock(e.end):' · в тот же день');const collision=overlaps(e,calendarEvents(state,dateKey(e.start),dateKey(e.end)));$('form-note').textContent=(work?dur(paidMinutes(e))+' оплачиваемого времени · '+cash(Math.round(paidMinutes(e)*e.rate/60*100)):'')+(collision.length?(work?' · ':'')+'Пересечение: '+collision.map(x=>x.title).join(', '):'')}catch(e){$('event-duration').textContent=e.message;$('form-note').textContent=''}}

let moneySection="overview";
function icon(name){return ICONS[name]||ICONS.CircleCheck}
function pageLink(act,label,symbol,detail='',extra=''){return `<button class="menu-row" data-act="${act}" ${extra}><span class="menu-icon">${icon(symbol)}</span><span class="menu-copy"><strong>${label}</strong>${detail?`<small>${detail}</small>`:''}</span>${icon('ChevronRight')}</button>`}
function applyTheme(){const theme=state.settings.theme||'system';document.documentElement.dataset.theme=theme;const dark=theme==='dark'||theme==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.querySelector('meta[name="theme-color"]').content=dark?'#111113':'#f5f5f7'}
function dayStrip(day){const model=dayBarModel(state,day),grid=model.ticks.slice(1,-1).map(t=>`<i class="strip-gridline" style="left:${t.left}%"></i>`).join('');return `<div class="day-strip"><div class="strip-caption"><strong>Расписание дня</strong><span ${model.isToday?'data-now-label':''}>${model.isToday?'Сейчас '+clock():dayLabel(day)}</span></div><div class="strip-axis"><span class="strip-axis-title">${model.hours} ч</span><div>${model.ticks.map((t,i)=>`<span class="${i===0?'first':i===model.ticks.length-1?'last':''}" style="left:${t.left}%">${t.label}</span>`).join('')}</div></div><div class="strip-board" role="img" aria-label="Расписание за ${esc(fullDay(day))}. Сон, работа и дела на отдельных дорожках. Точные часы и редактирование в списке ниже.">${model.rows.map(row=>`<div class="strip-row"><span class="strip-row-label ${row.key==='other'?'':'k-'+row.key}"><i></i>${row.label}</span><div class="strip-track" style="height:${row.lanes*16+8}px">${grid}${row.items.length?row.items.map(({e,left,width,lane})=>`<span class="strip-block k-${e.kind} ${e.planned?'is-planned':''}" style="left:${left}%;width:${width}%;top:${lane*16+6}px" title="${esc(e.title)} · ${clock(e.start)}–${clock(e.end)}${dateKey(e.end)!==dateKey(e.start)?' (+1 день)':''}${e.planned?' · план':''}"></span>`).join(''):`<span class="strip-empty">${row.key==='sleep'?'Сон не задан':row.key==='work'?'Без смен':'Нет событий'}</span>`}</div></div>`).join('')}${model.isToday?`<div class="strip-guides"><span class="strip-now" data-day-now="${day}" data-start="${model.start}" data-end="${model.end}" style="left:${model.now}%"></span></div>`:''}</div><div class="strip-footnote"><span>${model.planned?'Полупрозрачный сон — план':'Точное время — в списке ниже'}</span>${model.hours!==24?'<span>Перевод часов</span>':''}</div></div>`}
function currentCard(){const now=Date.now(),today=dateKey(),events=onDay(calendarEvents(state,today,today,now),today),active=events.filter(e=>Date.parse(e.start)<=now&&Date.parse(e.end)>now).sort((a,b)=>Number(!!a.planned)-Number(!!b.planned)),e=active[0],next=events.find(e=>Date.parse(e.start)>now),log=state.sleepLogs.find(l=>!l.end),focus=e||next,recording=!!log&&e?.id==='sleep-log:'+log.id,part=e?Math.max(0,Math.min(100,(now-Date.parse(e.start))/(Date.parse(e.end)-Date.parse(e.start))*100)):0;return `<section class="now-card ${e?'k-'+e.kind:''}"><div class="row spread"><span class="eyebrow">${e?e.planned?'Сейчас · план':'Сейчас':next?'Далее':'Твоё время'}</span><span id="live-clock" class="small num">${clock(now)}</span></div><div class="focus-title"><span class="focus-icon">${icon(focus?kindIcon(focus.kind):'Sun')}</span><h2>${esc(focus?.title||'Свободный вечер')}</h2></div><div class="row spread focus-meta"><span>${recording?'с '+clock(log.start):focus?clock(focus.start)+'–'+clock(focus.end):'Можно выдохнуть'}</span><strong id="live-focus">${recording?'идёт '+dur((now-Date.parse(log.start))/60000):e?'ещё '+dur((Date.parse(e.end)-now)/60000):next?'через '+dur((Date.parse(next.start)-now)/60000):''}</strong></div>${e&&!recording?`<div class="progress current-progress" role="progressbar" aria-label="Прогресс текущего события" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(part)}"><span id="focus-progress" data-start="${Date.parse(e.start)}" data-end="${Date.parse(e.end)}" style="width:${part}%"></span></div>`:''}${active.length>1?`<small class="muted">Ещё ${active.length-1} ${active.length===2?'событие одновременно':'события одновременно'}</small>`:''}${dayStrip(today)}${log?`<button class="sleep-prompt" data-act="wake-now">${icon('Sun')}<span>Доброе утро<strong>Я проснулся</strong></span>${icon('ArrowRight')}</button>`:Number(clock(now).slice(0,2))>=20||Number(clock(now).slice(0,2))<6?`<button class="sleep-prompt" data-act="bed-now">${icon('Moo function stability(s){const recent=sleepSummary(s).recent;if(recent.length<2)return null;const minutes=recent.map(l=>{const [h,m]=clock(l.end).split(':').map(Number);return h*60+m}),base=minutes[0],offsets=minutes.map(n=>((n-base+2160)%1440)-720),mean=offsets.reduce((a,b)=>a+b,0)/offsets.length;return Math.round(offsets.reduce((a,b)=>a+Math.abs(b-mean),0)/offsets.length)}

function refreshEntryForm(){const form=$('entry-form');if(!form)return;const type=form.elements.type.value,transfer=['save','withdraw'].includes(type),category=form.querySelector('[data-money-category]');if(category)category.hidden=transfer;if(transfer)form.elements.category.value='savings';if(form.elements.count){const monthly=form.elements.repeat.value==='monthly';form.elements.count.disabled=!monthly;form.querySelector('[data-entry-count]').hidden=!monthly}const box=$('entry-effect'),amount=Number(form.elements.amount.value),status=form.elements.status.value;let description=type==='save'?'Перевод: доступных станет меньше, отложенных — больше. Общая сумма денег не изменится.':type==='withdraw'?'Перевод: отложенных станет меньше, доступных — больше. Общая сумма денег не изменится.':type.startsWith('adjust')?'Уточнение остатка не считается доходом или расходом.':type==='income'?'Доход увеличит доступные деньги.':'Трата уменьшит доступные деньги.';if(status==='planned')description='План: остатки пока не меняются. После фактической оплаты или получения отметь операцию выполненной.';if(status==='paid'&&form.elements.date.value<state.settings.balanceDate)description='Эта дата раньше начала учёта ('+dayLabel(state.settings.balanceDate)+'). Запись останется в истории, но остатки не изменит.';if(!(amount>0)){box.textContent=description;return}try{const values=Object.fromEntries(new FormData(form).entries()),next=saveMoneyEntry(state,{...values,repeat:'none'},editing.id||'money-preview'),after=moneyTotals(next);box.innerHTML=`<p>${esc(description)}</p><div class="entry-after"><span>После сохранения</span><div><span>Доступно${after.cash===null?' по записям':''}</span><strong>${accountValue(after,'cash')}</strong></div><div><span>Отложено${after.savings===null?' по записям':''}</span><strong>${accountValue(after,'savings')}</strong></div></div>`}catch(error){box.textContent=error.message}}
function removeMoneyEntry(id){const entry=state.entries.find(e=>e.id===id);if(!entry){notify('Операция уже удалена.');return}const after=moneyTotals(deleteMoneyEntry(state,id)),known=after.cash!==null&&after.savings!==null;requestConfirm('Удалить «'+entry.title+'»?',cash(entry.amount)+' · '+dayLabel(entry.date)+'. Будет удалена только эта запись. '+(known?'После удаления: доступно '+cash(after.cash)+', отложено '+cash(after.savings)+'.':'Учтённые суммы пересчитаются.'),async ()=>{await commit(deleteMoneyEntry(state,id),'Операция удалена, остатки пересчитаны');closeModal()},'Удалить операцию')}

async function bootStorage(){document.body.classList.add('storage-loading');saveNotice();try{const result=await persistence.load();storageCorrupt=result.corrupt;storageRecovered=result.recovered;if(result.state)state=result.state;storageReady=true;if(syncEnabled){failedSave=persistence.pendingState;storageOK=result.connected&&!failedSave;storageError=failedSave?'Есть изменения, которые ещё не синхронизированы.':result.warning||''}else if(result.corrupt){storageOK=false;storageError='Не удалось прочитать сохранённые данные. Скачай исходную копию для восстановления.'}else if(!result.available.length){storageOK=false;storageError='Браузер блокирует хранение. Открой постоянную ссылку.'}else if(result.recovered){storageOK=true}else{try{state=await persistence.save(state);storageOK=true}catch(error){storageOK=false;storageError=error.message}}}catch(error){storageReady=true;storageOK=false;storageError=error.message}finally{document.body.classList.remove('storage-loading');setTab(['today','calendar','money','profile','sleep','tasks','rewards','reading'].includes(window.location.hash.slice(1))?window.location.hash.slice(1):'today')}}
async function reloadStored(force=false){if(!storageReady||saving||storageRefreshing||failedSave||$('confirm').open||!force&&($('editor').open&&editing?.type!=='day'||document.hidden))return;if(force&&$('editor').open&&editing?.type!=='day'){notify('Сначала закрой форму: введённые поля остаются на экране.');return}storageRefreshing=true;try{const result=await persistence.load();storageCorrupt=result.corrupt;if(result.unchanged){storageOK=true;storageError='';return}if(result.state){state=result.state;storageRecovered=result.recovered;failedSave=syncEnabled?persistence.pendingState:null;storageOK=syncEnabled?result.connected&&!failedSave:true;storageError=syncEnabled?result.warning||'':'';render();if($('editor').open&&editing?.type==='day'){const top=$('editor').scrollTop;openDay(editing.day);$('editor').scrollTop=top}if(force&&storageOK)notify(syncEnabled?'Получены последние записи календаря':'Открыты сохранённые записи')}else if(result.corrupt){storageOK=false;storageError='Записи не читаются. Сохрани резервную копию.'}else{storageOK=false;storageError=result.warning||'Сохранённые записи пока недоступны.'}}catch(error){storageOK=false;storageError=error.message}finally{storageRefreshing=false;saveNotice()}}

document.addEventListener('input',event=>{if(event.target.closest('#entry-form'))refreshEntryForm();if(event.target.closest('#event-form')){delete $('event-form').dataset.conflictsAccepted;updateEventNote()}if(event.target.closest('#task-form'))refreshTaskForm();if(event.target.closest('#sleep-night-form'))refreshNightForm()});
document.addEventListener('submit',async event=>{if(!event.target.closest('#editor'))return;event.preventDefault();if(!storageReady||saving||storageRefreshing){notify('Подожди завершения сохранения.');return}const form=event.target,f=new FormData(form),next=copy();try{if(await handleReadingForm(form,f))return; if(form.id==='budget-form'){const amount=Math.round(Number(f.get('amount'))*100);next.settings.monthlyBudgets={...next.settings.monthlyBudgets,[editing.month]:amount};await commit(next,'Бюджет сохранён')}else if(form.id==='event-form'){const e=eventFromForm(),repeat=String(f.get('repeat')||'none'),added=expandEvents(e,{startDay:dateKey(e.start),repeat,weekdays:f.getAll('weekdays').map(Number),until:String(f.get('until')||'')});next.events=next.events.filter(x=>x.id!==editing.id).concat(added);const linked=next.tasks.find(t=>t.eventId===editing.id);if(linked)next.tasks=next.tasks.filter(t=>t.id!==linked.id);if(f.has('checkable')){for(const item of added){const duration=Math.round((Date.parse(item.end)-Date.parse(item.start))/60000);if(duration>1440)throw Error('Для события с галочкой выбери длительность до суток.');next.tasks.push({id:item.id===e.id&&linked?linked.id:uid(),title:item.title,due:dateKey(item.start),duration:Math.max(1,duration),priority:linked?.priority||'normal',done:item.id===e.id&&linked?linked.done:false,eventId:item.id,autoEvent:true})}}validate(next);const colliding=added.some(e=>overlaps(e,calendarEvents(next,dateKey(e.start),dateKey(e.end))).length);if(colliding&&!form.dataset.conflictsAccepted){requestConfirm('События пересекаются','Сохранить, несмотря на пересечение? На шкале события будут показаны отдельно.',()=>{form.dataset.conflictsAccepted='true';form.requestSubmit()},'Всё равно сохранить');return}await commit(next,'Событие сохранено');selected=dateKey(e.start);month=selected.slice(0,7)}else if(form.id==='task-form'){const values=Object.fromEntries(f.entries());values.weekdays=f.getAll('weekdays').map(Number);values.timed=f.has('timed');values.endRepeat=f.has('endRepeat');const updated=taskEditorState(state,editing,values);await commit(updated,values.repeat==='none'?'Дело добавлено в список':'Повторение сохранено — галочки отдельные для каждого дня')}else if(form.id==='entry-form'){const values=Object.fromEntries(f.entries());const updated=saveMoneyEntry(state,values,editing.id);moneyHistoryPeriod='all';moneyFilter='all';moneySection='history';await commit(updated,editing.id?'Операция изменена, остатки пересчитаны':'Операция добавлена, остатки обновлены')}else if(form.id==='money-balances-form'){if(!String(f.get('currentCash')).trim()||!String(f.get('currentSavings')).trim())throw Error('Укажи обе суммы; если денег нет, введи 0.');const updated=setCurrentMoney(state,Math.round(Number(f.get('currentCash'))*100),Math.round(Number(f.get('currentSavings'))*100));await commit(updated,'Доступные деньги и накопления обновлены')}else if(form.id==='money-goal-form'){next.settings.goal=Math.round(Number(f.get('goal'))*100);next.settings.goalName=String(f.get('goalName')).trim();await commit(next,'Цель сохранена')} else if(form.id==='sleep-settings-form'){next.settings.sleepPlan={enabled:f.has('enabled'),bed:String(f.get('bed')),rise:String(f.get('rise')),adjust:f.has('adjust'),buffer:Number(f.get('buffer'))};await commit(next,'План сна обновлён')}
else if(form.id==='sleep-night-form'){await commit(saveSleepNight(state,editing.day,String(f.get('bed')),String(f.get('rise'))),'Изменена только эта ночь')}
else if(form.id==='sleep-log-form'){const values=Object.fromEntries(f.entries());values.planned=f.has('planned');values.screenOff=f.has('screenOff');const updated=saveSleepLog(state,editing.type,values,editing.id),points=rewardSummary(updated).total-rewardSummary(state).total;await commit(updated,'Чекап сохранён'+(points?' · +'+points+' баллов':''))}
else if(form.id==='reward-form'){const reward={id:editing.id||uid(),title:String(f.get('title')).trim(),cost:Number(f.get('cost')),note:String(f.get('note')||'').trim()};next.rewards.catalog=next.rewards.catalog.filter(r=>r.id!==reward.id).concat(reward);await commit(next,'Награда сохранена')}
else if(form.id==='settings-form'){const nullable=name=>String(f.get(name)).trim()===''?null:Math.round(Number(f.get(name))*100);next.settings={...next.settings,rate:Number(f.get('rate')),openingCash:nullable('openingCash'),openingSavings:nullable('openingSavings'),balanceDate:String(f.get('balanceDate')),goal:Math.round(Number(f.get('goal'))*100),goalName:String(f.get('goalName')).trim(),wake:String(f.get('wake')),sleep:String(f.get('sleep'))};if(next.settings.balanceDate>dateKey())throw Error('Начало учёта не может быть в будущем.');await commit(next,'Настройки сохранены')}closeModal();render()}catch(error){const e=$('form-error');if(e)e.innerHTML=esc(error.message)+(failedSave?(syncEnabled?'<button type="button" class="btn full-btn" data-act="retry-sync">Повторить синхронизацию</button>':'')+'<button type="button" class="btn full-btn" data-act="export">Сохранить копию с изменениями</button>':'');else notify(error.message)}});
$('confirm-go').addEventListener('click',async()=>{const fn=confirmCallback;confirmCallback=null;$('confirm').close();try{await fn?.()}catch(e){notify(e.message)}});
$('import-file').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;try{if(file.size>5000000)throw Error('Копия слишком большая. Максимум 5 МБ.');const parsed=JSON.parse(await file.text());pendingImport=upgrade(parsed.state||parsed);requestConfirm('Восстановить копию?',`Будет ${pendingImport.events.length} событий, ${pendingImport.tasks.length} разовых дел, ${pendingImport.routines.length} повторений и ${pendingImport.entries.length} операций. Текущие записи будут заменены. На сайте замена распространится на все твои устройства.`,async()=>{await commit(pendingImport,'Копия восстановлена и сохранена',{allowReplace:true,replace:syncEnabled});pendingImport=null;closeModal()},'Восстановить')}catch(error){notify(error.message)}});
document.querySelector('.tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const tabs=['today','calendar','money','profile'],i=tabs.indexOf(tab),next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length;setTab(tabs[next]);$('tab-'+tabs[next]).focus()});
window.addEventListener('storage',event=>{if(event.key===STORE||event.key===STORE+':account'){if($('editor').open){notify('Другая вкладка изменила записи. Форма сохранена для проверки.');return}void reloadStored()}});window.addEventListener('focus',()=>{void reloadStored()});window.addEventListener('beforeunload',event=>{if(saving||failedSave){event.preventDefault();event.returnValue=''}});
let lastMinute='',lastCurrentDay=dateKey();function tick(){if(!storageReady)return;tickReading();const now=Date.now(),currentDay=dateKey(now),minute=currentDay+' '+clock(now);if(currentDay!==lastCurrentDay){if(selected===lastCurrentDay){selected=currentDay;month=currentDay.slice(0,7)}lastCurrentDay=currentDay}if(minute!==lastMinute&&!saving&&!storageRefreshing&&!$('editor').open&&!$('confirm').open){lastMinute=minute;render()}for(const line of document.querySelectorAll('[data-day-now]')){line.hidden=line.dataset.dayNow!==currentDay;line.style.left=progressPercent(now-Number(line.dataset.start),Number(line.dataset.end)-Number(line.dataset.start))+'%'}for(const label of document.querySelectorAll('[data-now-label]'))label.textContent='Сейчас '+clock(now);if(tab!=='today')return;if(selected===dateKey(now)){const [s,e]=bounds(selected),pct=Math.max(0,Math.min(100,(now-s)/(e-s)*100));if($('now-line'))$('now-line').style.left=pct+'%';if($('day-progress')){$('day-progress').style.width=pct+'%';$('day-progress').parentElement.setAttribute('aria-valuenow',String(Math.round(pct)))}if($('live-clock'))$('live-clock').textContent=clock(now);const focus=$('focus-progress');if(focus){const end=Number(focus.dataset.end),start=Number(focus.dataset.start),progress=Math.max(0,Math.min(100,(now-start)/(end-start)*100));focus.style.width=progress+'%';focus.parentElement.setAttribute('aria-valuenow',String(Math.round(progress)));if($('live-focus'))$('live-focus').textContent='ещё '+dur(Math.max(0,end-now)/60000)}}}
$('editor').addEventListener('close',()=>{closeReader();document.body.classList.remove('modal-open')});$('editor').addEventListener('cancel',event=>{if(saving){event.preventDefault();return}editing=null});window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);window.addEventListener('pageshow',event=>{if(event.persisted)window.location.reload()});void bootStorage();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();void reloadStored()}});if(syncEnabled)setInterval(()=>{void reloadStored()},2000);window.addEventListener('online',()=>{if(failedSave)notify('Связь вернулась. Нажми «Повторить синхронизацию».');else void reloadStored()});
})();
</script>
